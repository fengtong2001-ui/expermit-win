appId: com.fengtong.expermit
productName: ExPermit 实验记录本
directories:
  output: release
  buildResources: build
files:
  - app/shell/**
  - node_modules/fflate/**
  - package.json
extraResources:
  - from: app/www
    to: www
  - from: resources/update-config.json
    to: update-config.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  artifactName: ExPermit-Setup-${version}.exe
portable:
  artifactName: ExPermit-Portable-${version}.exe
